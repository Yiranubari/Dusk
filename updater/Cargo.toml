[package]
name = "updater"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
serde_json = "1"
shellexpand = "3"
solana-account = "2.2"
solana-client = "2.2"
solana-pubkey = "2.2"
solana-sdk = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-instruction = "2.2"
solana-signer = "2.2"

[build-dependencies]
serde_json = "1"